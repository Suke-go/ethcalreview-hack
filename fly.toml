# fly.toml — EthicalReviewHacker (single-tenant)
# 使い方:
#   1. flyctl auth login
#   2. flyctl launch --no-deploy        # 初回のみ。app 名を一意に書き換える
#   3. flyctl volumes create ethics_data --region nrt --size 1
#   4. flyctl secrets set GEMINI_API_KEY=... OPENAI_API_KEY=...    (任意)
#   5. flyctl deploy

app = "ethical-review-hacker"  # ← 一意な名前に変更すること
primary_region = "nrt"          # 東京。近いリージョンに変えて OK

[build]

[env]
  PORT = "8000"
  HOST = "0.0.0.0"
  ETHICS_DATA_DIR = "/data"
  ERH_FRONTEND_DIST = "/app/frontend/dist"

# 永続ボリューム (settings.json / sessions / output)
[[mounts]]
  source = "ethics_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # 使われない時は VM を停止してコスト圧縮 (リクエストで自動起動)
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

# ヘルスチェック (/health は API only)
[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512  # LLM 推論はリモートなので 512MB で足りる
