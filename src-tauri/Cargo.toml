[package]
name = "ethical-review-hacker"
version = "0.1.3"
description = "EthicalReviewHacker — Tauri wrapper"
authors = ["Zempo Lab"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ethical_review_hacker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# devtools: リリースビルドでも DevTools を有効化 (WebView 内のエラー診断に必須)
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
