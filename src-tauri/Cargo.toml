[package]
name = "ethical-review-hacker"
version = "0.1.1"
description = "EthicalReviewHacker — Tauri wrapper"
authors = ["Zempo Lab"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ethical_review_hacker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
